[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swappy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.2", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "argon2-cffi>=23,<26", "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3", "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "imagekitio>=5,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
app = ["assets/avatars/*.svg"]
