services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: swappy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or root .env}
      POSTGRES_DB: swappy
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swappy -d swappy"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
